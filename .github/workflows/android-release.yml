name: Android 16 APK & Release
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Test and build installable APK
        run: gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace
      - name: Verify min SDK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "sdkVersion:'36'"
      - uses: actions/upload-artifact@v4
        with:
          name: SeritDex-Android16-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v0.1.${{ github.run_number }}"
          name: "ŞeritDeX Android 16 - Build ${{ github.run_number }}"
          prerelease: true
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
